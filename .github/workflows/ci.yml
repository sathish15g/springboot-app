name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/springboot-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test
        run: mvn -B verify

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-gitops:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: sathish15g/springboot-gitops
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Bump image tag
        run: |
          FILE=charts/springboot-app/values.yaml
          yq -i '.image.tag = "${{ github.sha }}"' $FILE
          yq -i '(.env[] | select(.name == "APP_VERSION")).value = "${{ github.sha }}"' $FILE
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Deploy springboot-app ${{ github.sha }}"
          git push
